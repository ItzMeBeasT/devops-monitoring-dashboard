apiVersion: apps/v1
kind: Deployment

metadata:
  name: cadvisor
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cadvisor

  template:
    metadata:
      labels:
        app: cadvisor

    spec:
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.1

          ports:
            - containerPort: 8080

          securityContext:
            privileged: true

          args:
            - --housekeeping_interval=10s
            - --docker_only=false

          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true

            - name: sys
              mountPath: /sys
              readOnly: true

            - name: var-lib
              mountPath: /var/lib
              readOnly: true

            - name: disk
              mountPath: /dev/disk
              readOnly: true

      volumes:
        - name: rootfs
          hostPath:
            path: /

        - name: sys
          hostPath:
            path: /sys

        - name: var-lib
          hostPath:
            path: /var/lib

        - name: disk
          hostPath:
            path: /dev/disk
