apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: prometheus-egress
  namespace: monitoring

spec:
  podSelector:
    matchLabels:
      app: prometheus

  policyTypes:
    - Egress

  egress:
    # Allow Prometheus to scrape Node Exporter
    - to:
        - podSelector:
            matchLabels:
              app: node-exporter
      ports:
        - protocol: TCP
          port: 9100

    # Allow Prometheus to scrape cAdvisor
    - to:
        - podSelector:
            matchLabels:
              app: cadvisor
      ports:
        - protocol: TCP
          port: 8080

    # Allow Prometheus to send alerts to Alertmanager
    - to:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - protocol: TCP
          port: 9093
